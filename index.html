<!DOCTYPE html>
<html>
<head>
    <title>Brain Boost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
           <ul>
            <li>Home</li>
            <li>Tasks</li>
            <li>Focus</li>
            <li>About</li>
           </ul>
        </nav>
    </header>
    <section class="hero">
        <div class="hero-text">
            <h2>Plan Your Day</h2>
            <p>Organize your tasks and make your day better.</p>
            <button>Start Planning </button>
        </div>
        <div class="hero-image">
            <img src="image.jpg" alt="Daily planning">
        </div>
    </section>
    <div class="planner-container">
    <h1>Code My Day</h1>

    <div class="input-section">
        <input type="text" id="task-input" placeholder="Booting task terminal...">
        <button id="add-btn">Add Mission</button>
    </div>

    <ul id="task-list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
